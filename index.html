<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">⚡ TaskFlow</div>
    <nav><a href="register.html">Inscription</a></nav>
  </header>
  <div class="container">
    <div class="auth-layout">
      <div class="form-card">
        <h1>Connexion</h1>
        <form id="login-form">
          <input id="email" type="email" placeholder="Email" required>
          <input id="password" type="password" placeholder="Mot de passe" required>
          <p id="error"></p>
          <button type="submit">Se connecter</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
      </div>
      <div class="auth-image">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=900&q=80" alt="Illustration">
      </div>
    </div>
  </div>
  <footer>© 2025 TaskFlow — Simplifiez votre gestion de projets</footer>

  <script src="index.js"></script>
</body></html>
